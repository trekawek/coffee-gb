name: Maven release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (for example, 1.7.5)
        required: true
        type: string
      development_version:
        description: Next development version (for example, 1.7.6-SNAPSHOT)
        required: true
        type: string
      sign_native_packages:
        description: Sign/notarize every native target with protected release credentials
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: maven-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.release_version }}
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven-central
    outputs:
      source_sha: ${{ steps.release-source.outputs.source_sha }}
      tag_ref: ${{ steps.release-source.outputs.tag_ref }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java and release-signing credentials
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure the release commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate release versions
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          DEVELOPMENT_VERSION: ${{ inputs.development_version }}
        run: |
          version_pattern='^[0-9A-Za-z][0-9A-Za-z._-]*$'

          if [[ ! "$RELEASE_VERSION" =~ $version_pattern || "$RELEASE_VERSION" == *-SNAPSHOT ]]; then
            echo "release_version must be a valid non-SNAPSHOT Maven version" >&2
            exit 1
          fi

          if [[ ! "$DEVELOPMENT_VERSION" =~ $version_pattern || "$DEVELOPMENT_VERSION" != *-SNAPSHOT ]]; then
            echo "development_version must be a valid Maven version ending in -SNAPSHOT" >&2
            exit 1
          fi

      - name: Check release secrets
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          missing=()
          [[ -n "$MAVEN_CENTRAL_USERNAME" ]] || missing+=(MAVEN_CENTRAL_USERNAME)
          [[ -n "$MAVEN_CENTRAL_TOKEN" ]] || missing+=(MAVEN_CENTRAL_TOKEN)
          [[ -n "$MAVEN_GPG_PRIVATE_KEY" ]] || missing+=(MAVEN_GPG_PRIVATE_KEY)
          [[ -n "$MAVEN_GPG_PASSPHRASE" ]] || missing+=(MAVEN_GPG_PASSPHRASE)

          if (( ${#missing[@]} )); then
            printf 'Missing release secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Prepare the release commits and exact tag without publishing
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          DEVELOPMENT_VERSION: ${{ inputs.development_version }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          "-DreleaseVersion=${RELEASE_VERSION}"
          "-DdevelopmentVersion=${DEVELOPMENT_VERSION}"
          "-Dtag=coffee-gb-${RELEASE_VERSION}"
          "-Darguments=-Dmaven.javadoc.skip=true --no-transfer-progress"
          release:clean release:prepare

      - name: Resolve the immutable prepared release source
        id: release-source
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          tag="coffee-gb-${RELEASE_VERSION}"
          tag_ref="refs/tags/$tag"
          git fetch --no-tags origin "$tag_ref"
          source_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Prepared release tag did not resolve to a full commit ID" >&2
            exit 1
          fi
          tagged_version=$(git show "$source_sha:pom.xml" |
            sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' |
            head -1)
          if [[ "$tagged_version" != "$RELEASE_VERSION" ]]; then
            echo "Prepared tag contains Maven version $tagged_version" >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag_ref=$tag_ref" >> "$GITHUB_OUTPUT"

  native-packages:
    name: Validate complete native package matrix
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/native-packages.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.tag_ref }}
      release_version: ${{ inputs.release_version }}
      release_signing: ${{ inputs.sign_native_packages }}
    secrets: inherit

  publish-maven:
    name: Publish Maven artifacts after native validation
    needs: [prepare, native-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven-central
    permissions:
      contents: read

    steps:
      - name: Check out the exact validated release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Recheck the immutable release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG_REF: ${{ needs.prepare.outputs.tag_ref }}
        run: |
          if [[ "$TAG_REF" != "refs/tags/coffee-gb-${RELEASE_VERSION}" ||
                "$(git rev-parse 'HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Maven publication source does not match the validated release tag" >&2
            exit 1
          fi
          git fetch --no-tags origin "$TAG_REF"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Release tag moved after native validation" >&2
            exit 1
          fi

      - name: Check Maven publication secrets
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          missing=()
          [[ -n "$MAVEN_CENTRAL_USERNAME" ]] || missing+=(MAVEN_CENTRAL_USERNAME)
          [[ -n "$MAVEN_CENTRAL_TOKEN" ]] || missing+=(MAVEN_CENTRAL_TOKEN)
          [[ -n "$MAVEN_GPG_PRIVATE_KEY" ]] || missing+=(MAVEN_GPG_PRIVATE_KEY)
          [[ -n "$MAVEN_GPG_PASSPHRASE" ]] || missing+=(MAVEN_GPG_PASSPHRASE)
          if (( ${#missing[@]} )); then
            printf 'Missing publication secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Publish the validated tag to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -P release
          -Dmaven.javadoc.skip=true
          deploy

  publish-github:
    name: Publish GitHub release after Maven publication
    needs: [prepare, native-packages, publish-maven]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: native-release
    permissions:
      contents: write

    steps:
      - name: Check out the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the complete validated native release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-release-bundle
          path: native-release

      - name: Verify provenance and publish the complete GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG_REF: ${{ needs.prepare.outputs.tag_ref }}
        run: |
          tag="coffee-gb-${RELEASE_VERSION}"
          if [[ "$TAG_REF" != "refs/tags/$tag" ||
                "$(git rev-parse 'HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "GitHub publication source does not match the validated release tag" >&2
            exit 1
          fi
          git fetch --no-tags origin "$TAG_REF"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Release tag moved after Maven publication" >&2
            exit 1
          fi
          if ! grep -qx "app.version=$RELEASE_VERSION" \
              native-release/NATIVE-PACKAGE-MATRIX.properties ||
             ! grep -qx "source.commit=$SOURCE_SHA" \
              native-release/NATIVE-PACKAGE-MATRIX.properties; then
            echo "Release bundle provenance does not match the validated source" >&2
            exit 1
          fi
          (
            cd native-release
            sha256sum --check SHA256SUMS
          )
          transaction_tmp=$(mktemp -d)
          trap 'rm -rf -- "$transaction_tmp"' EXIT
          mapfile -t release_paths < <(
            find native-release -mindepth 1 -maxdepth 1 -type f -print | sort
          )
          if (( ${#release_paths[@]} == 0 )) ||
             find native-release -mindepth 1 -maxdepth 1 ! -type f -print -quit |
                grep -q .; then
            echo "Validated release bundle must contain only regular top-level files" >&2
            exit 1
          fi
          if find native-release -mindepth 1 -maxdepth 1 -type f \
              -iname '*.json' -print -quit | grep -q .; then
            echo "Validated release bundle must not contain JSON artifacts" >&2
            exit 1
          fi
          printf '%s\n' "${release_paths[@]##*/}" >"$transaction_tmp/expected-assets"

          signing_lines="$transaction_tmp/signing-lines"
          : >"$signing_lines"
          for target in \
              linux-x86-64 \
              windows-x86-64 \
              macos-x86-64 \
              macos-aarch64; do
            mapfile -t signing_matches < <(
              grep -E "^target\\.${target}\\.signing=" \
                native-release/NATIVE-PACKAGE-MATRIX.properties || true
            )
            if (( ${#signing_matches[@]} != 1 )); then
              echo "Release matrix has no unique signing state for $target" >&2
              exit 1
            fi
            signing=${signing_matches[0]#*=}
            if [[ "$signing" != unsigned &&
                  "$signing" != verified-embedded &&
                  "$signing" != verified-detached ]]; then
              echo "Release matrix has invalid signing state for $target" >&2
              exit 1
            fi
            printf -- '- `%s`: `%s`\n' "$target" "$signing" >>"$signing_lines"
          done
          generated_notes="$transaction_tmp/generated-notes.md"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$tag" \
            --jq '.body' >"$generated_notes"
          if (( $(wc -c <"$generated_notes") > 1048576 )); then
            echo "Generated release notes exceed the bounded size" >&2
            exit 1
          fi
          release_notes="$transaction_tmp/release-notes.md"
          known_limitations="$transaction_tmp/known-limitations.md"
          cat >"$known_limitations" <<'EOF'
          ## Known platform limitations
          On macOS, game controllers require a compatible system SDL2 installation; keyboard input and emulation remain usable without it.
          EOF
          {
            echo '## Native package signing evidence'
            cat "$signing_lines"
            echo
            cat "$known_limitations"
            echo
            cat "$generated_notes"
          } >"$release_notes"

          verify_remote_notes() {
            gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json body \
              --jq '.body | @base64' |
              base64 --decode >"$transaction_tmp/remote-notes.md"
            local remote_title
            remote_title=$(gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json name \
              --jq '.name')
            if [[ "$remote_title" != "coffee-gb ${RELEASE_VERSION}" ]]; then
              echo "GitHub release title differs from the validated release title" >&2
              return 1
            fi
            if ! cmp --silent "$release_notes" "$transaction_tmp/remote-notes.md"; then
              echo "GitHub release notes differ from the exact validated release notes" >&2
              return 1
            fi
          }

          verify_remote_assets() {
            local download_root
            download_root=$(mktemp -d "$transaction_tmp/download.XXXXXX")
            gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' |
              sort >"$transaction_tmp/actual-assets"
            if ! diff -u \
                "$transaction_tmp/expected-assets" \
                "$transaction_tmp/actual-assets"; then
              echo "GitHub release asset names differ from the validated bundle" >&2
              return 1
            fi
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$download_root"
            local path name
            for path in "${release_paths[@]}"; do
              name=${path##*/}
              if ! cmp --silent "$path" "$download_root/$name"; then
                echo "GitHub release asset digest differs from validated $name" >&2
                return 1
              fi
            done
          }

          release_state=$(gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | @tsv' 2>/dev/null || true)
          if [[ "$release_state" == $'false\tfalse' ]]; then
            verify_remote_assets
            verify_remote_notes
            echo "Existing public GitHub release already matches the validated bundle."
            exit 0
          fi
          if [[ "$release_state" == $'false\ttrue' ]]; then
            echo "Existing public GitHub release is unexpectedly a prerelease" >&2
            exit 1
          fi
          if [[ -z "$release_state" ]]; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "coffee-gb ${RELEASE_VERSION}" \
              --notes-file "$release_notes" \
              --draft
          elif [[ "$release_state" != $'true\tfalse' &&
                  "$release_state" != $'true\ttrue' ]]; then
            echo "Unable to determine existing GitHub release state" >&2
            exit 1
          fi

          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "coffee-gb ${RELEASE_VERSION}" \
            --notes-file "$release_notes" \
            --prerelease=false
          if [[ $(gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | @tsv') != $'true\tfalse' ]]; then
            echo "GitHub release is not a stable draft before asset replacement" >&2
            exit 1
          fi

          mapfile -t stale_assets < <(
            gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )
          for asset in "${stale_assets[@]}"; do
            gh release delete-asset "$tag" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          done
          gh release upload "$tag" "${release_paths[@]}" \
            --repo "$GITHUB_REPOSITORY"
          verify_remote_assets
          verify_remote_notes
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false
          if [[ $(gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | @tsv') != $'false\tfalse' ]]; then
            echo "GitHub release is not a stable public release after publication" >&2
            exit 1
          fi
          verify_remote_assets
          verify_remote_notes
