name: Native package CI

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]
    tags: [ "coffee-gb-*" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact branch, commit, or release tag to package
        required: false
        default: ""
        type: string
      publish:
        description: Publish the complete validated matrix to the matching GitHub release
        required: false
        default: false
        type: boolean
      release_version:
        description: Expected non-SNAPSHOT Maven version for a release call
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: native-packages-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: ${{ !inputs.publish }}

jobs:
  resolve-source:
    name: Resolve immutable package source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag_ref: ${{ steps.source.outputs.tag_ref }}

    steps:
      - name: Check out requested source for resolution
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the immutable source commit
        id: source
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.checkout_ref }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          candidate=${REQUESTED_REF:-$GITHUB_REF}
          tag_ref=
          if [[ "$PUBLISH" == true || "$candidate" == refs/tags/coffee-gb-* ]]; then
            if [[ ! "$candidate" =~ ^refs/tags/coffee-gb-[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
              echo "Release packaging requires a fully qualified refs/tags/coffee-gb-VERSION ref" >&2
              exit 1
            fi
            tag_ref=$candidate
            git fetch --no-tags origin "$tag_ref"
            source_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          else
            source_sha=$(git rev-parse 'HEAD^{commit}')
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Package source did not resolve to a full immutable commit ID" >&2
            exit 1
          fi
          if [[ "$(git rev-parse 'HEAD^{commit}')" != "$source_sha" ]]; then
            echo "Checked-out HEAD does not equal the peeled requested source commit" >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag_ref=$tag_ref" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.target }}
    needs: resolve-source
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86-64
            package_type: deb
            runner: ubuntu-24.04
          - target: windows-x86-64
            package_type: msi
            runner: windows-2025
          - target: macos-x86-64
            package_type: dmg
            runner: macos-15-intel
          - target: macos-aarch64
            package_type: dmg
            runner: macos-15

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the exact package source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false

      - name: Prove checkout equals the resolved immutable commit
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          if [[ "$(git rev-parse 'HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Package checkout does not equal resolved source commit $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Set up target-architecture JDK 21 and safe Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Prove target runner architecture
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          actual=$(uname -m)
          case "$PACKAGE_TARGET:$actual" in
            linux-x86-64:x86_64|macos-x86-64:x86_64|macos-aarch64:arm64) ;;
            *)
              echo "Runner architecture $actual cannot build $PACKAGE_TARGET" >&2
              exit 1
              ;;
          esac

      - name: Prove Windows target runner architecture and WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "X64") {
            throw "windows-x86-64 requires an X64 runner"
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            throw "The Windows runner has no WiX candle.exe required by JDK 21 jpackage"
          }
          if (-not (Get-Command light.exe -ErrorAction SilentlyContinue)) {
            throw "The Windows runner has no WiX light.exe required by JDK 21 jpackage"
          }

      - name: Build, test, inspect, and package
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
          COFFEE_GB_DESKTOP_SMOKE: "true"
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            command -v xvfb-run >/dev/null
            xvfb-run -a ./packaging/package-native.sh "$PACKAGE_TARGET" "$PACKAGE_TYPE"
          else
            ./packaging/package-native.sh "$PACKAGE_TARGET" "$PACKAGE_TYPE"
          fi

      - name: Build, test, inspect, and package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
          COFFEE_GB_DESKTOP_SMOKE: "true"
        run: >-
          ./packaging/package-native.ps1
          -Target $env:PACKAGE_TARGET
          -Type $env:PACKAGE_TYPE

      - name: Unpack final installer and repeat strict launch smokes
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
          COFFEE_GB_DESKTOP_SMOKE: "true"
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a ./packaging/verify-native-package.sh \
              "$PACKAGE_TARGET" \
              "swing/target/native-package-${PACKAGE_TARGET}-${PACKAGE_TYPE}"
          else
            ./packaging/verify-native-package.sh \
              "$PACKAGE_TARGET" \
              "swing/target/native-package-${PACKAGE_TARGET}-${PACKAGE_TYPE}"
          fi

      - name: Unpack final installer and repeat strict launch smokes
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
          COFFEE_GB_DESKTOP_SMOKE: "true"
        run: >-
          ./packaging/verify-native-package.ps1
          -Target $env:PACKAGE_TARGET
          -BuildRoot "swing/target/native-package-$env:PACKAGE_TARGET-$env:PACKAGE_TYPE"

      - name: Prepare bounded unsigned CI artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
        run: |
          build_root="swing/target/native-package-${PACKAGE_TARGET}-${PACKAGE_TYPE}"
          upload_root="swing/target/native-ci-upload-${PACKAGE_TARGET}"
          package_root="$upload_root/package"
          mkdir -p "$package_root"
          cp "$build_root"/dist/* "$package_root"/
          if [[ "$PACKAGE_TARGET" == linux-x86-64 ]]; then
            shopt -s nullglob
            portable=(
              swing/target/coffee-gb-*.jar
            )
            filtered=()
            for candidate in "${portable[@]}"; do
              [[ "$candidate" == *-app.jar ]] || filtered+=("$candidate")
            done
            if (( ${#filtered[@]} != 1 )); then
              echo "Expected exactly one portable Maven JAR, found ${#filtered[@]}" >&2
              exit 1
            fi
            mkdir "$upload_root/portable"
            cp "${filtered[0]}" "$upload_root/portable/"
          fi

      - name: Prepare bounded unsigned CI artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
        run: |
          $BuildRoot = "swing/target/native-package-$env:PACKAGE_TARGET-$env:PACKAGE_TYPE"
          $UploadRoot = "swing/target/native-ci-upload-$env:PACKAGE_TARGET"
          $PackageRoot = Join-Path $UploadRoot "package"
          New-Item -ItemType Directory -Path $PackageRoot | Out-Null
          Copy-Item -Path "$BuildRoot/dist/*" -Destination $PackageRoot

      - name: Upload target installer, checksum, SBOM, and result manifest
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: swing/target/native-ci-upload-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release-gate:
    name: Gate complete native package matrix
    needs: [resolve-source, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Maven version metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false

      - name: Recheck immutable source and peeled release tag
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          TAG_REF: ${{ needs.resolve-source.outputs.tag_ref }}
        run: |
          if [[ "$(git rev-parse 'HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Release gate checkout does not equal resolved source commit" >&2
            exit 1
          fi
          if [[ -n "$TAG_REF" ]]; then
            git fetch --no-tags origin "$TAG_REF"
            if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
              echo "Release tag no longer peels to the resolved source commit" >&2
              exit 1
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Download every required target
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: downloaded-native

      - name: Assemble and verify release-level artifacts
        shell: bash
        env:
          EXPECTED_RELEASE_VERSION: ${{ inputs.release_version }}
          RESOLVED_TAG_REF: ${{ needs.resolve-source.outputs.tag_ref }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          version=$(mvn -B --no-transfer-progress help:evaluate \
            -Dexpression=project.version \
            -DforceStdout \
            -q)
          release_version=$EXPECTED_RELEASE_VERSION
          if [[ -n "$RESOLVED_TAG_REF" ]]; then
            tag_name=${RESOLVED_TAG_REF#refs/tags/}
            tag_version=${tag_name#coffee-gb-}
            if [[ -n "$release_version" && "$release_version" != "$tag_version" ]]; then
              echo "Requested release $release_version does not match tag $tag_version" >&2
              exit 1
            fi
            release_version=$tag_version
          fi
          if [[ -n "$release_version" && "$version" != "$release_version" ]]; then
            echo "Maven version $version does not match tagged/requested release $release_version" >&2
            exit 1
          fi
          if [[ -n "$release_version" && "$version" == *-SNAPSHOT ]]; then
            echo "Snapshot native packages cannot pass a release gate" >&2
            exit 1
          fi
          mapfile -t portable < <(
            find downloaded-native -type f -name "coffee-gb-${version}.jar" -print
          )
          if (( ${#portable[@]} != 1 )); then
            echo "Expected exactly one portable JAR, found ${#portable[@]}" >&2
            exit 1
          fi
          java \
            -cp "${portable[0]}" \
            eu.rekawek.coffeegb.swing.packaging.NativeReleaseTool \
            assemble \
            --input downloaded-native \
            --portable-jar "${portable[0]}" \
            --output native-release \
            --version "$version" \
            --source-commit "$SOURCE_SHA"

      - name: Upload complete release bundle
        uses: actions/upload-artifact@v4
        with:
          name: native-release-bundle
          path: native-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish validated tagged packages
    if: inputs.publish
    needs: [resolve-source, release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: native-release
    permissions:
      contents: write

    steps:
      - name: Check out the immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download complete release bundle
        uses: actions/download-artifact@v4
        with:
          name: native-release-bundle
          path: native-release

      - name: Publish only an exact non-SNAPSHOT release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          TAG_REF: ${{ needs.resolve-source.outputs.tag_ref }}
        run: |
          if [[ ! "$TAG_REF" =~ ^refs/tags/(coffee-gb-([0-9A-Za-z][0-9A-Za-z._-]*))$ ]]; then
            echo "Native publication requires an exact fully qualified release tag" >&2
            exit 1
          fi
          tag=${BASH_REMATCH[1]}
          version=${BASH_REMATCH[2]}
          if [[ "$(git rev-parse 'HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Publication checkout does not equal resolved source commit" >&2
            exit 1
          fi
          git fetch --no-tags origin "$TAG_REF"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Release tag moved after package source resolution; refusing publication" >&2
            exit 1
          fi
          if ! grep -qx "source.commit=$SOURCE_SHA" \
              native-release/NATIVE-PACKAGE-MATRIX.properties; then
            echo "Release bundle is not bound to the resolved source commit" >&2
            exit 1
          fi
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Snapshot native packages cannot be published" >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_VERSION" && "$version" != "$REQUESTED_VERSION" ]]; then
            echo "Tag version $version does not match requested $REQUESTED_VERSION" >&2
            exit 1
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "coffee-gb ${version}"
          fi
          gh release upload "$tag" native-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
