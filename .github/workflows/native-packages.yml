name: Native package CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact branch, commit, or release tag to package
        required: false
        default: ""
        type: string
      release_signing:
        description: Rebuild, sign, and verify all targets after the unsigned matrix passes
        required: false
        default: false
        type: boolean
      release_version:
        description: Expected non-SNAPSHOT Maven version for a release call
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: native-packages-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  resolve-source:
    name: Resolve immutable package source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag_ref: ${{ steps.source.outputs.tag_ref }}

    steps:
      - name: Check out requested source for resolution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the immutable source commit
        id: source
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.checkout_ref }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          candidate=${REQUESTED_REF:-$GITHUB_REF}
          tag_ref=
          if [[ -n "$RELEASE_VERSION" || "$candidate" == refs/tags/coffee-gb-* ]]; then
            if [[ ! "$candidate" =~ ^refs/tags/coffee-gb-[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
              echo "Release packaging requires a fully qualified refs/tags/coffee-gb-VERSION ref" >&2
              exit 1
            fi
            tag_ref=$candidate
            git fetch --no-tags origin "$tag_ref"
            source_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          else
            source_sha=$(git rev-parse 'HEAD^{commit}')
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Package source did not resolve to a full immutable commit ID" >&2
            exit 1
          fi
          if [[ "$(git rev-parse 'HEAD^{commit}')" != "$source_sha" ]]; then
            echo "Checked-out HEAD does not equal the peeled requested source commit" >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag_ref=$tag_ref" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.target }}
    needs: resolve-source
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86-64
            package_type: deb
            runner: ubuntu-24.04
          - target: windows-x86-64
            package_type: msi
            runner: windows-2025
          - target: macos-x86-64
            package_type: dmg
            runner: macos-15-intel
          - target: macos-aarch64
            package_type: dmg
            runner: macos-15

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the exact package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false

      - name: Prove checkout equals the resolved immutable commit
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          if [[ "$(git rev-parse 'HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Package checkout does not equal resolved source commit $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Set up target-architecture JDK 21 and safe Maven cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Reuse prepared release unit-test result
        if: runner.os != 'Windows' && inputs.release_version != ''
        shell: bash
        run: |
          maven_wrapper="$RUNNER_TEMP/coffee-gb-prepared-release-maven"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'exec mvn -Dskip.unit.tests=true "$@"' \
            > "$maven_wrapper"
          chmod 700 "$maven_wrapper"
          echo "COFFEE_GB_MAVEN_COMMAND=$maven_wrapper" >> "$GITHUB_ENV"

      - name: Reuse prepared Windows release unit-test result
        if: runner.os == 'Windows' && inputs.release_version != ''
        shell: pwsh
        run: |
          $MavenWrapper = Join-Path $env:RUNNER_TEMP "coffee-gb-prepared-release-maven.ps1"
          @'
          $ErrorActionPreference = "Stop"
          $Maven = (
            Get-Command "mvn.cmd" -CommandType Application -ErrorAction Stop |
              Select-Object -First 1
          ).Source
          if ($Maven -isnot [string] -or [string]::IsNullOrWhiteSpace($Maven)) {
            throw "Maven command did not resolve to one application path"
          }
          & $Maven "-Dskip.unit.tests=true" @args
          exit $LASTEXITCODE
          '@ | Set-Content -LiteralPath $MavenWrapper -Encoding utf8NoBOM
          "COFFEE_GB_MAVEN_COMMAND=$MavenWrapper" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove target runner architecture
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          actual=$(uname -m)
          case "$PACKAGE_TARGET:$actual" in
            linux-x86-64:x86_64|macos-x86-64:x86_64|macos-aarch64:arm64) ;;
            *)
              echo "Runner architecture $actual cannot build $PACKAGE_TARGET" >&2
              exit 1
              ;;
          esac

      - name: Install WiX toolset for Windows MSI packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "X64") {
            throw "windows-x86-64 requires an X64 runner"
          }
          $WixBin = Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.11\bin"
          $Candle = Join-Path $WixBin "candle.exe"
          $Light = Join-Path $WixBin "light.exe"
          if (-not (Test-Path -LiteralPath $Candle -PathType Leaf) -or
              -not (Test-Path -LiteralPath $Light -PathType Leaf)) {
            choco install wixtoolset --version=3.11.2 --yes --no-progress
          }
          if (-not (Test-Path -LiteralPath $Candle -PathType Leaf) -or
              -not (Test-Path -LiteralPath $Light -PathType Leaf)) {
            throw "WiX 3.11 candle.exe and light.exe are required by JDK 21 jpackage"
          }
          $WixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux package validation prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends desktop-file-utils gnome-menus xdg-utils
          command -v desktop-file-validate >/dev/null
          command -v xdg-desktop-menu >/dev/null
          test -d /etc/xdg/menus
          test -d /usr/share/desktop-directories

      - name: Build, test, inspect, and package
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
          COFFEE_GB_DESKTOP_SMOKE: "true"
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            command -v xvfb-run >/dev/null
            xvfb-run -a ./packaging/package-native.sh "$PACKAGE_TARGET" "$PACKAGE_TYPE"
          else
            ./packaging/package-native.sh "$PACKAGE_TARGET" "$PACKAGE_TYPE"
          fi

      - name: Build, test, inspect, and package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
          COFFEE_GB_DESKTOP_SMOKE: "true"
        run: >-
          ./packaging/package-native.ps1
          -Target $env:PACKAGE_TARGET
          -Type $env:PACKAGE_TYPE

      - name: Unpack final installer and repeat strict launch smokes
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
          COFFEE_GB_DESKTOP_SMOKE: "true"
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a ./packaging/verify-native-package.sh \
              "$PACKAGE_TARGET" \
              "swing/target/native-package-${PACKAGE_TARGET}-${PACKAGE_TYPE}"
          else
            ./packaging/verify-native-package.sh \
              "$PACKAGE_TARGET" \
              "swing/target/native-package-${PACKAGE_TARGET}-${PACKAGE_TYPE}"
          fi

      - name: Install the MSI and repeat strict launch smokes
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
          COFFEE_GB_DESKTOP_SMOKE: "true"
        run: >-
          ./packaging/verify-native-package.ps1
          -Target $env:PACKAGE_TARGET
          -BuildRoot "swing/target/native-package-$env:PACKAGE_TARGET-$env:PACKAGE_TYPE"

      - name: Prepare bounded unsigned CI artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
        run: |
          build_root="swing/target/native-package-${PACKAGE_TARGET}-${PACKAGE_TYPE}"
          upload_root="swing/target/native-ci-upload-${PACKAGE_TARGET}"
          package_root="$upload_root/package"
          mkdir -p "$package_root"
          cp "$build_root"/dist/* "$package_root"/
          if [[ "$PACKAGE_TARGET" == linux-x86-64 ]]; then
            shopt -s nullglob
            portable=(
              swing/target/coffee-gb-*.jar
            )
            filtered=()
            for candidate in "${portable[@]}"; do
              [[ "$candidate" == *-app.jar ]] || filtered+=("$candidate")
            done
            if (( ${#filtered[@]} != 1 )); then
              echo "Expected exactly one portable Maven JAR, found ${#filtered[@]}" >&2
              exit 1
            fi
            mkdir "$upload_root/portable"
            cp "${filtered[0]}" "$upload_root/portable/"
          fi

      - name: Prepare bounded unsigned CI artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
        run: |
          $BuildRoot = "swing/target/native-package-$env:PACKAGE_TARGET-$env:PACKAGE_TYPE"
          $UploadRoot = "swing/target/native-ci-upload-$env:PACKAGE_TARGET"
          $PackageRoot = Join-Path $UploadRoot "package"
          New-Item -ItemType Directory -Path $PackageRoot | Out-Null
          Copy-Item -Path "$BuildRoot/dist/*" -Destination $PackageRoot

      - name: Upload target package and internal validation metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: swing/target/native-ci-upload-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release-gate:
    name: Gate complete native package matrix
    needs: [resolve-source, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Maven version metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false

      - name: Recheck immutable source and peeled release tag
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          TAG_REF: ${{ needs.resolve-source.outputs.tag_ref }}
        run: |
          if [[ "$(git rev-parse 'HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Release gate checkout does not equal resolved source commit" >&2
            exit 1
          fi
          if [[ -n "$TAG_REF" ]]; then
            git fetch --no-tags origin "$TAG_REF"
            if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
              echo "Release tag no longer peels to the resolved source commit" >&2
              exit 1
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Download every required target
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: downloaded-native

      - name: Assemble and verify release-level artifacts
        shell: bash
        env:
          EXPECTED_RELEASE_VERSION: ${{ inputs.release_version }}
          RESOLVED_TAG_REF: ${{ needs.resolve-source.outputs.tag_ref }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          version=$(mvn -B --no-transfer-progress help:evaluate \
            -Dexpression=project.version \
            -DforceStdout \
            -q)
          release_version=$EXPECTED_RELEASE_VERSION
          if [[ -n "$RESOLVED_TAG_REF" ]]; then
            tag_name=${RESOLVED_TAG_REF#refs/tags/}
            tag_version=${tag_name#coffee-gb-}
            if [[ -n "$release_version" && "$release_version" != "$tag_version" ]]; then
              echo "Requested release $release_version does not match tag $tag_version" >&2
              exit 1
            fi
            release_version=$tag_version
          fi
          if [[ -n "$release_version" && "$version" != "$release_version" ]]; then
            echo "Maven version $version does not match tagged/requested release $release_version" >&2
            exit 1
          fi
          if [[ -n "$release_version" && "$version" == *-SNAPSHOT ]]; then
            echo "Snapshot native packages cannot pass a release gate" >&2
            exit 1
          fi
          mapfile -t portable < <(
            find downloaded-native -type f -name "coffee-gb-${version}.jar" -print
          )
          if (( ${#portable[@]} != 1 )); then
            echo "Expected exactly one portable JAR, found ${#portable[@]}" >&2
            exit 1
          fi
          java \
            -cp "${portable[0]}" \
            eu.rekawek.coffeegb.swing.packaging.NativeReleaseTool \
            assemble \
            --input downloaded-native \
            --portable-jar "${portable[0]}" \
            --output native-release \
            --version "$version" \
            --source-commit "$SOURCE_SHA"
          grep -qx "source.commit=$SOURCE_SHA" \
            native-release/NATIVE-PACKAGE-MATRIX.properties

      - name: Upload validated unsigned release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-unsigned-release-bundle
          path: native-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Promote unsigned bundle when signing was not requested
        if: ${{ !inputs.release_signing }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-bundle
          path: native-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  sign-package:
    name: Sign and reverify ${{ matrix.target }}
    if: >-
      inputs.release_signing &&
      !startsWith(github.event_name, 'pull_request') &&
      inputs.release_version != ''
    needs: [resolve-source, release-gate]
    timeout-minutes: 90
    environment: native-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86-64
            package_type: deb
            runner: ubuntu-24.04
          - target: windows-x86-64
            package_type: msi
            runner: windows-2025
          - target: macos-x86-64
            package_type: dmg
            runner: macos-15-intel
          - target: macos-aarch64
            package_type: dmg
            runner: macos-15

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the exact validated release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false

      - name: Prove signed checkout and release tag provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          TAG_REF: ${{ needs.resolve-source.outputs.tag_ref }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          expected_tag="refs/tags/coffee-gb-${RELEASE_VERSION}"
          if [[ "$TAG_REF" != "$expected_tag" ||
                "$(git rev-parse 'HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Signing source is not the exact validated release tag" >&2
            exit 1
          fi
          git fetch --no-tags origin "$TAG_REF"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Release tag moved before signing" >&2
            exit 1
          fi

      - name: Set up target-architecture JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Reuse prepared release unit-test result
        if: runner.os != 'Windows' && inputs.release_version != ''
        shell: bash
        run: |
          maven_wrapper="$RUNNER_TEMP/coffee-gb-prepared-release-maven"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'exec mvn -Dskip.unit.tests=true "$@"' \
            > "$maven_wrapper"
          chmod 700 "$maven_wrapper"
          echo "COFFEE_GB_MAVEN_COMMAND=$maven_wrapper" >> "$GITHUB_ENV"

      - name: Reuse prepared Windows release unit-test result
        if: runner.os == 'Windows' && inputs.release_version != ''
        shell: pwsh
        run: |
          $MavenWrapper = Join-Path $env:RUNNER_TEMP "coffee-gb-prepared-release-maven.ps1"
          @'
          $ErrorActionPreference = "Stop"
          $Maven = (
            Get-Command "mvn.cmd" -CommandType Application -ErrorAction Stop |
              Select-Object -First 1
          ).Source
          if ($Maven -isnot [string] -or [string]::IsNullOrWhiteSpace($Maven)) {
            throw "Maven command did not resolve to one application path"
          }
          & $Maven "-Dskip.unit.tests=true" @args
          exit $LASTEXITCODE
          '@ | Set-Content -LiteralPath $MavenWrapper -Encoding utf8NoBOM
          "COFFEE_GB_MAVEN_COMMAND=$MavenWrapper" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install WiX toolset for Windows MSI packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "X64") {
            throw "windows-x86-64 requires an X64 runner"
          }
          $WixBin = Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.11\bin"
          $Candle = Join-Path $WixBin "candle.exe"
          $Light = Join-Path $WixBin "light.exe"
          if (-not (Test-Path -LiteralPath $Candle -PathType Leaf) -or
              -not (Test-Path -LiteralPath $Light -PathType Leaf)) {
            choco install wixtoolset --version=3.11.2 --yes --no-progress
          }
          if (-not (Test-Path -LiteralPath $Candle -PathType Leaf) -or
              -not (Test-Path -LiteralPath $Light -PathType Leaf)) {
            throw "WiX 3.11 candle.exe and light.exe are required by JDK 21 jpackage"
          }
          $WixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux package validation prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends desktop-file-utils gnome-menus xdg-utils
          command -v desktop-file-validate >/dev/null
          command -v xdg-desktop-menu >/dev/null
          test -d /etc/xdg/menus
          test -d /usr/share/desktop-directories

      - name: Import isolated Linux signing key
        if: runner.os == 'Linux'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.NATIVE_LINUX_GPG_PRIVATE_KEY }}
          SIGNING_KEY_ID: ${{ secrets.NATIVE_LINUX_GPG_KEY_ID }}
        run: |
          [[ -n "$SIGNING_KEY" && -n "$SIGNING_KEY_ID" ]] || {
            echo "Linux release signing secrets are not configured" >&2
            exit 1
          }
          signing_home="$RUNNER_TEMP/coffee-gb-gnupg"
          mkdir -m 700 "$signing_home"
          export GNUPGHOME="$signing_home"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$SIGNING_KEY_ID" >/dev/null
          {
            echo "GNUPGHOME=$signing_home"
            echo "COFFEE_GB_LINUX_GPG_KEY_ID=$SIGNING_KEY_ID"
          } >> "$GITHUB_ENV"

      - name: Import isolated Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.NATIVE_WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.NATIVE_WINDOWS_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ secrets.NATIVE_WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:TIMESTAMP_URL)) {
            throw "Windows release signing secrets are not configured"
          }
          if (-not $env:TIMESTAMP_URL.StartsWith("https://")) {
            throw "The Windows timestamp URL must use HTTPS"
          }
          $Pfx = Join-Path $env:RUNNER_TEMP "coffee-gb-release.pfx"
          [IO.File]::WriteAllBytes(
              $Pfx,
              [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          try {
            $Password = ConvertTo-SecureString `
              $env:CERTIFICATE_PASSWORD `
              -AsPlainText `
              -Force
            $Certificate = Import-PfxCertificate `
              -FilePath $Pfx `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $Password `
              -Exportable:$false
          } finally {
            Remove-Item -LiteralPath $Pfx -Force -ErrorAction SilentlyContinue
          }
          if (-not $Certificate -or
              $Certificate.Thumbprint -notmatch '^[0-9A-Fa-f]{40}$') {
            throw "The Windows signing certificate has no valid SHA-1 thumbprint"
          }
          if (-not (Get-Command signtool.exe -ErrorAction SilentlyContinue)) {
            throw "signtool.exe is unavailable"
          }
          "COFFEE_GB_WINDOWS_CERTIFICATE_SHA1=$($Certificate.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COFFEE_GB_WINDOWS_TIMESTAMP_URL=$env:TIMESTAMP_URL" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import isolated macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.NATIVE_MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.NATIVE_MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_KEY_USER_NAME: ${{ secrets.NATIVE_MACOS_SIGNING_KEY_USER_NAME }}
          SIGNING_IDENTITY: ${{ secrets.NATIVE_MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NATIVE_MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NATIVE_MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NATIVE_MACOS_NOTARY_PASSWORD }}
        run: |
          for variable in \
              CERTIFICATE_BASE64 \
              CERTIFICATE_PASSWORD \
              SIGNING_KEY_USER_NAME \
              SIGNING_IDENTITY \
              NOTARY_APPLE_ID \
              NOTARY_TEAM_ID \
              NOTARY_PASSWORD; do
            [[ -n "${!variable}" ]] || {
              echo "macOS release signing secret $variable is not configured" >&2
              exit 1
            }
          done
          keychain="$RUNNER_TEMP/coffee-gb-release.keychain-db"
          certificate="$RUNNER_TEMP/coffee-gb-release.p12"
          keychain_password=$(openssl rand -hex 32)
          printf '%s' "$CERTIFICATE_BASE64" |
            openssl base64 -d -A -out "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T "$JAVA_HOME/bin/jpackage"
          rm -f -- "$certificate"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" |
            grep -F "\"$SIGNING_IDENTITY\"" >/dev/null || {
              echo "The requested Developer ID Application identity was not imported" >&2
              exit 1
            }
          xcrun notarytool store-credentials coffee-gb-release \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --keychain "$keychain"
          {
            echo "COFFEE_GB_MAC_SIGNING_KEY_USER_NAME=$SIGNING_KEY_USER_NAME"
            echo "COFFEE_GB_MAC_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "COFFEE_GB_MAC_SIGNING_KEYCHAIN=$keychain"
            echo "COFFEE_GB_MAC_NOTARY_KEYCHAIN_PROFILE=coffee-gb-release"
            echo "COFFEE_GB_MAC_NOTARY_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Rebuild, sign, verify, and smoke the release package
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
          COFFEE_GB_DESKTOP_SMOKE: "true"
          COFFEE_GB_RELEASE_SIGNING: "true"
          COFFEE_GB_RELEASE_VERSION: ${{ inputs.release_version }}
          COFFEE_GB_RELEASE_TAG: coffee-gb-${{ inputs.release_version }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a ./packaging/package-native.sh \
              "$PACKAGE_TARGET" \
              "$PACKAGE_TYPE" \
              --release-sign
            xvfb-run -a ./packaging/verify-native-package.sh \
              "$PACKAGE_TARGET" \
              "swing/target/native-package-${PACKAGE_TARGET}-${PACKAGE_TYPE}"
          else
            ./packaging/package-native.sh \
              "$PACKAGE_TARGET" \
              "$PACKAGE_TYPE" \
              --release-sign
            ./packaging/verify-native-package.sh \
              "$PACKAGE_TARGET" \
              "swing/target/native-package-${PACKAGE_TARGET}-${PACKAGE_TYPE}"
          fi

      - name: Rebuild, sign, verify, and smoke the release package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
          COFFEE_GB_DESKTOP_SMOKE: "true"
          COFFEE_GB_RELEASE_SIGNING: "true"
          COFFEE_GB_RELEASE_VERSION: ${{ inputs.release_version }}
          COFFEE_GB_RELEASE_TAG: coffee-gb-${{ inputs.release_version }}
        run: |
          ./packaging/package-native.ps1 `
            -Target $env:PACKAGE_TARGET `
            -Type $env:PACKAGE_TYPE `
            -ReleaseSign
          ./packaging/verify-native-package.ps1 `
            -Target $env:PACKAGE_TARGET `
            -BuildRoot "swing/target/native-package-$env:PACKAGE_TARGET-$env:PACKAGE_TYPE"

      - name: Prepare bounded signed target artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
        run: |
          build_root="swing/target/native-package-${PACKAGE_TARGET}-${PACKAGE_TYPE}"
          upload_root="swing/target/native-signed-upload-${PACKAGE_TARGET}"
          mkdir -p "$upload_root/package"
          cp "$build_root"/dist/* "$upload_root/package"/
          if [[ "$PACKAGE_TARGET" == linux-x86-64 ]]; then
            shopt -s nullglob
            portable=(swing/target/coffee-gb-*.jar)
            filtered=()
            for candidate in "${portable[@]}"; do
              [[ "$candidate" == *-app.jar ]] || filtered+=("$candidate")
            done
            if (( ${#filtered[@]} != 1 )); then
              echo "Expected exactly one portable Maven JAR, found ${#filtered[@]}" >&2
              exit 1
            fi
            mkdir "$upload_root/portable"
            cp "${filtered[0]}" "$upload_root/portable/"
          fi

      - name: Prepare bounded signed target artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
        run: |
          $BuildRoot = "swing/target/native-package-$env:PACKAGE_TARGET-$env:PACKAGE_TYPE"
          $UploadRoot = "swing/target/native-signed-upload-$env:PACKAGE_TARGET"
          $PackageRoot = New-Item `
            -ItemType Directory `
            -Path (Join-Path $UploadRoot "package")
          Copy-Item -Path "$BuildRoot/dist/*" -Destination $PackageRoot

      - name: Upload verified signed target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-signed-${{ matrix.target }}
          path: swing/target/native-signed-upload-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove isolated release credentials
        if: always()
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS && -n "${COFFEE_GB_MAC_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$COFFEE_GB_MAC_SIGNING_KEYCHAIN" || true
          elif [[ "$RUNNER_OS" == Linux && -n "${GNUPGHOME:-}" ]]; then
            find "$GNUPGHOME" -type f -delete
            find "$GNUPGHOME" -depth -type d -empty -delete
          fi

      - name: Remove isolated Windows release certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:COFFEE_GB_WINDOWS_CERTIFICATE_SHA1) {
            Remove-Item `
              -LiteralPath "Cert:\CurrentUser\My\$env:COFFEE_GB_WINDOWS_CERTIFICATE_SHA1" `
              -Force `
              -ErrorAction SilentlyContinue
          }

  signed-release-gate:
    name: Gate complete signed native package matrix
    if: >-
      inputs.release_signing &&
      !startsWith(github.event_name, 'pull_request') &&
      inputs.release_version != ''
    needs: [resolve-source, sign-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out signed release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false

      - name: Recheck immutable signed release source
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          TAG_REF: ${{ needs.resolve-source.outputs.tag_ref }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "$TAG_REF" != "refs/tags/coffee-gb-${RELEASE_VERSION}" ||
                "$(git rev-parse 'HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Signed release gate source mismatch" >&2
            exit 1
          fi
          git fetch --no-tags origin "$TAG_REF"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
            echo "Release tag moved after signing" >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Download every verified signed target
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-signed-*
          path: downloaded-native

      - name: Assemble and verify signed release-level artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          version=$(mvn -B --no-transfer-progress help:evaluate \
            -Dexpression=project.version \
            -DforceStdout \
            -q)
          if [[ "$version" != "$RELEASE_VERSION" || "$version" == *-SNAPSHOT ]]; then
            echo "Signed package Maven version $version does not match $RELEASE_VERSION" >&2
            exit 1
          fi
          mapfile -t portable < <(
            find downloaded-native -type f -name "coffee-gb-${version}.jar" -print
          )
          if (( ${#portable[@]} != 1 )); then
            echo "Expected exactly one signed-matrix portable JAR, found ${#portable[@]}" >&2
            exit 1
          fi
          java \
            -cp "${portable[0]}" \
            eu.rekawek.coffeegb.swing.packaging.NativeReleaseTool \
            assemble \
            --input downloaded-native \
            --portable-jar "${portable[0]}" \
            --output native-release \
            --version "$version" \
            --source-commit "$SOURCE_SHA"
          grep -qx "source.commit=$SOURCE_SHA" \
            native-release/NATIVE-PACKAGE-MATRIX.properties
          if grep -q '=unsigned$' native-release/NATIVE-PACKAGE-MATRIX.properties; then
            echo "Signed release matrix still contains an unsigned target" >&2
            exit 1
          fi

      - name: Upload complete verified signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-bundle
          path: native-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
