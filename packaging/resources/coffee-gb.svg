<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-labelledby="title description">
  <title id="title">Coffee GB</title>
  <desc id="description">
    A warm coffee mug shaped like a pocket game system, with steam, a green screen,
    a directional pad, and two action buttons.
  </desc>

  <!-- Transparent corners keep the mark neutral on desktop icon themes. -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#211410"/>

  <!-- The handle sits behind the console body so the silhouette reads as a mug. -->
  <path fill="#e7c790" fill-rule="evenodd"
        d="M360 205h35c47 0 83 37 83 84v41c0 47-36 84-83 84h-35V205zm35 44h-13v121h13c22 0 39-18 39-40v-41c0-22-17-40-39-40z"/>

  <!-- Steam is deliberately chunky enough to survive 16 px rendering. -->
  <path d="M219 127c-19-18 15-36-2-61" fill="none" stroke="#fff0d2"
        stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M286 127c-19-18 15-36-2-61" fill="none" stroke="#fff0d2"
        stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="78" y="140" width="330" height="305" rx="72" fill="#e7c790"/>
  <rect x="128" y="160" width="230" height="28" rx="14" fill="#4b2a1b"/>
  <rect x="122" y="205" width="242" height="110" rx="24" fill="#a8b86c"/>

  <path d="M158 335h38v32h32v38h-32v32h-38v-32h-32v-38h32z"
        fill="#4b2a1b"/>
  <circle cx="315" cy="365" r="25" fill="#c45c3c"/>
  <circle cx="362" cy="402" r="25" fill="#c45c3c"/>
</svg>
